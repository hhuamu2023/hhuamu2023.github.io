<style>

  /* 卡片風格 */
  .card{
    background:#fff;
    border:1px solid rgba(196,140,147,.15);
    border-radius:1.6rem;
    box-shadow: var(--shadow);
  }

  .soft-card{
    background:#FFFDF9;

  .b-pending{background:#FEF3C7;color:#B45309;}
  .b-confirmed{background:#D1FAE5;color:#047857;}
  .b-completed{background:#E5E7EB;color:#374151;}
  .b-cancelled{background:#FEE2E2;color:#B91C1C;}

  .section-title{
    font-size:13px;
    font-weight:900;
    color:#9B7A5E;
    margin-bottom:6px;

    display:flex;
    justify-content:space-between;
    font-size:13px;
    font-weight:700;
    padding:4px 0;
    border-bottom:1px dashed rgba(0,0,0,.06);

.hero-wrap{
  background:linear-gradient(180deg,#fff, #fff5f4);
  border:1px solid rgba(196,140,147,.18);
  border-radius:24px;
  padding:18px;
  box-shadow:0 16px 40px rgba(196,140,147,.15);
}

.search-box{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 16px;
  background:#fff;
  border-radius:20px;
  border:1px solid rgba(196,140,147,.2);
  box-shadow:0 8px 16px rgba(196,140,147,.08);
}
.search-box input{
  flex:1;
  border:none;
  outline:none;
  font-size:14px;
  font-weight:800;
  color:#2B2B2B;
}

.tabs-wrap{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.tab-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:12px;
  border-radius:18px;
  font-size:13px;
  font-weight:900;
  border:1px solid rgba(196,140,147,.18);
  background:#fff;
  color:#9B7A5E;
  box-shadow:0 6px 16px rgba(196,140,147,.08);
  transition:all .2s ease;
}
.tab-btn.active{
  background:#C48C93;
  color:white;
  border-color:#C48C93;
  box-shadow:0 12px 24px rgba(196,140,147,.25);
}

.stats-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  font-weight:900;
  color:#9B7A5E;
}

function normalizePayload(p){ if(typeof p==="string"){ try{return JSON.parse(p)}catch{} } return p||{}; }
function badgeClass(status){ if(status==="confirmed") return "badge b-confirmed"; if(status==="completed") return "badge b-completed"; if(status==="cancelled") return "badge b-cancelled"; return "badge b-pending"; }

// ✅ 台灣時區格式化（顯示用）
function fmtTW(iso, withSec=false){
  if(!iso) return "-";
  const opt = {
    timeZone: "Asia/Taipei",
    year: "numeric", month: "2-digit", day: "2-digit",
    hour: "2-digit", minute: "2-digit",
    hour12: false
  };
  if(withSec) opt.second = "2-digit";
  return new Intl.DateTimeFormat("zh-TW", opt).format(new Date(iso)).replace(/\//g,"-");
}

function setStatusUI(status){

  $("detailStatusBadge").className = badgeClass(status) + " mt-2 inline-block";
  $("detailStatusBadge").textContent = badgeText(status);

  // buttons
  document.querySelectorAll(".statusBtn").forEach(btn=>{
    btn.classList.remove("active");
    if(btn.dataset.status === status){
      btn.classList.add("active");
    }
  });
}
async function fetchRecords(){
  const { data, error } = await sb.from("service_contracts")
    .select("id,created_at,owner_phone,pet_name,payload,status,admin_note")
    .order("created_at",{ascending:false}).limit(300);
  if(error){ console.error(error); return; }
  records = (data||[]).map(r=>({...r,payload:normalizePayload(r.payload)}));
}

async function handleChangePassword(){
  $("pwdError").classList.add("hidden");
  const oldPwd = $("pwdOld").value.trim();
  const newPwd = $("pwdNew").value.trim();
  const confirmPwd = $("pwdConfirm").value.trim();

  if(!oldPwd || !newPwd || !confirmPwd){
    $("pwdError").textContent = "請完整填寫所有欄位";
    $("pwdError").classList.remove("hidden");
    return;
  }
  if(newPwd.length < 6){
    $("pwdError").textContent = "新密碼至少 6 碼";
    $("pwdError").classList.remove("hidden");
    return;
  }
  if(newPwd !== confirmPwd){
    $("pwdError").textContent = "新密碼與確認不一致";
    $("pwdError").classList.remove("hidden");
    return;
  }

  try{
    // 用獨立 sbPwd 驗證舊密碼
    await sbPwd.auth.signOut();
    const { error: signErr } = await sbPwd.auth.signInWithPassword({
      email: pwdTargetEmail,
      password: oldPwd
    });
    if(signErr) throw new Error("舊密碼錯誤");

    const { error: upErr } = await sbPwd.auth.updateUser({ password: newPwd });
    if(upErr) throw upErr;

    await sbPwd.auth.signOut();
    alert("✅ 密碼更新成功");
    closePwdModal();
  }catch(err){
    $("pwdError").textContent = "修改失敗：" + err.message;
    $("pwdError").classList.remove("hidden");
  }
}

// ===== 搜尋 debounce =====
let __searchTimer = null;
function handleSearchInput(){
  if(__searchTimer) clearTimeout(__searchTimer);
  __searchTimer = setTimeout(()=>{
    renderRecords();
    if(!$("customersPanel").classList.contains("hidden")) renderCustomers();
  }, 300);
}

function renderRecords(){
  const container = $("recordsList");
  const q = ($("searchInput").value || "").trim();

  const filtered = records.filter(r=>{
    const p = r.payload || {};
    const owner = (p.owner_name || "").toString();
    const phone = (r.owner_phone || p.owner_phone || "").toString();
    const pet = (r.pet_name || p.pet_name || "").toString();
    return !q || owner.includes(q) || phone.includes(q) || pet.includes(q);
  });
  container.innerHTML = "";
  if(filtered.length===0){ 
  $("recordsEmpty").classList.remove("hidden"); 
  $("recordsCount").textContent = 0;
  return; 
}
  $("recordsEmpty").classList.add("hidden");
  $("recordsCount").textContent = filtered.length;

  filtered.forEach(r=>{
    const p=r.payload||{};
    const div=document.createElement("div");
    div.className="rounded-2xl border border-hanamu-green/15 bg-white p-4 shadow-soft cursor-pointer";
div.innerHTML = `
  <div class="flex justify-between items-start gap-3">
    <div>
      <div class="text-[10px] text-hanamu-wood font-bold mb-1">${fmtTW(r.created_at)}</div>
      <div class="text-xl font-black">${r.pet_name||p.pet_name||"-"}</div>
      <div class="text-xs text-hanamu-wood mt-1">${p.owner_name||"-"} ｜ ${r.owner_phone||"-"}</div>
      <div class="text-xs text-hanamu-wood mt-1">服務：${p.service_type||"-"}</div>
    </div>
    <div class="text-right">
      <div class="${badgeClass(r.status||"pending")}">${badgeText(r.status||"pending")}</div>
    </div>
  </div>
`;
    div.onclick=()=>openDetail(r.id);
    container.appendChild(div);
  });
}

function renderCustomers(){
  const q = ($("searchInput").value || "").trim();
  const groups = {};
  records.forEach(r=>{
    const p=r.payload||{};
    const phone=(r.owner_phone||p.owner_phone||"").toString();
    if(!phone) return;

    const owner = (p.owner_name||"").toString();
    const pet   = (p.pet_name||"").toString();

    if(q && !owner.includes(q) && !phone.includes(q) && !pet.includes(q)) return;

    if(!groups[phone]) groups[phone] = { phone, owner: p.owner_name||"-", pets:new Set(), count:0, history:[] };
    groups[phone].pets.add(p.pet_name||"-");
    groups[phone].count++;
    groups[phone].history.push(r);
  });
  const list = Object.values(groups);
  const container = $("customersList");
  container.innerHTML = "";
  if(list.length===0){ $("customersEmpty").classList.remove("hidden"); return; }
  $("customersEmpty").classList.add("hidden");

  list.forEach(c=>{
    const div=document.createElement("div");
div.className="card p-4 cursor-pointer hover:border-hanamu-green transition-all";
div.innerHTML=`
  <div class="flex items-center justify-between gap-3">

      <div class="font-black text-lg">${c.owner}</div>
      <div class="text-xs text-hanamu-wood mt-1">${c.phone}</div>
      <div class="text-[10px] text-hanamu-wood mt-1">毛孩：${[...c.pets].join("、")}</div>
    </div>
    <div class="text-right">
    <div class="text-sm font-black text-hanamu-green mt-1">累計</div>

    </div>

`;

function buildFinishMsg(){
  const p = selectedRecord?.payload || {};
  const pet = p.pet_name || "毛孩";

  const overall = ($("finishOverall").value || "").trim();
  const skin    = ($("finishSkin").value || "").trim();
  const fee     = ($("finishFee").value || "").trim();
  const extra   = ($("finishExtra").value || "").trim();

  const lines = [];
  lines.push("【美容完成通知】");
  lines.push(`${pet}已洗香香完成囉！`);

  // ✅ 只有有內容才顯示「整體狀況」區塊
  if (overall || skin || fee) {
    lines.push("今日美容整體狀況如下：");
    if (overall) lines.push(`- 整體狀況：${overall}`);
    if (skin)    lines.push(`- 皮膚／外觀狀況：${skin}`);
    if (fee)     lines.push(`- 費用明細：${fee}`);
  }

  // ✅ 特別提醒只有有填才顯示
  if (extra) {
    lines.push("");
    lines.push("特別提醒：");
    lines.push(extra);
  }

  lines.push("");
  lines.push("請於通知後一小時內接回，逾時一小時以上將酌收100元逾時費喔！");

  return lines.join("\n");
}

<script>

(function () {
  if (!("serviceWorker" in navigator)) return;

  function canAutoReloadNow() {
    // 填表頁盡量不要自動刷新，避免使用者填到一半資料消失
    const hash = location.hash || "#home";
    const inGrooming = hash.includes("grooming");
    return !inGrooming;
  }

  function toast(type, text, subText) {
    // 你有 showMsg 就用它；沒有也不會報錯
    try {
      if (typeof showMsg === "function") showMsg(type, text, subText);
    } catch (e) {}
  }

  window.addEventListener("load", async () => {
    try {
      const reg = await navigator.serviceWorker.register("/sw.js?v=7", { scope: "/" });

      // 只要 SW 控制權換人（新 SW 啟用），就重新整理到新版本
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });

      // 若一進來就已經有 waiting（代表背景已下載好新版本）
      if (reg.waiting) {
        if (canAutoReloadNow()) {
          reg.waiting.postMessage({ type: "SKIP_WAITING" });
        } else {
          toast(
  "ok",
  "✅ 偵測到新版本",
  "建議將此頁重新整理以套用最新版本"
);
        }
      }

      // 偵測更新流程
      reg.addEventListener("updatefound", () => {
        const newWorker = reg.installing;
        if (!newWorker) return;

        newWorker.addEventListener("statechange", () => {
          // state === installed 且已有舊 controller，表示「有新版本」且已下載完成，正在 waiting
          if (newWorker.state === "installed" && navigator.serviceWorker.controller) {
            if (reg.waiting) {
              if (canAutoReloadNow()) {
                reg.waiting.postMessage({ type: "SKIP_WAITING" });
              } else {
                toast(
  "ok",
  "✅ 偵測到新版本",
  "建議將此頁重新整理以套用最新版本"
);
              }
            }
          }
        });
      });

      // 主動定期檢查更新（30 分鐘一次）
      setInterval(() => {
        reg.update().catch(() => {});
      }, 30 * 60 * 1000);

      // 首次也更新一次（避免太久才更新）
      reg.update().catch(() => {});

    } catch (err) {
      console.warn("Service Worker 註冊失敗：", err);
    }
  });
})();
</script>
